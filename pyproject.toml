[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lab-tommy"
version = "0.1.0"
description = "A readable Python coding agent with Chinese comments and an offline demo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-lab = "agent_lab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_lab*"]
